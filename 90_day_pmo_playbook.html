<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90-Day PMO Playbook</title>
     
      <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <!-- Logo / Brand -->
            <a href="index.html" class="flex items-center gap-2 group">
                <div
                    class="bg-slate-900 text-white p-1.5 rounded-lg group-hover:bg-indigo-600 transition-colors duration-300">
                    <i data-lucide="layers" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg tracking-tight text-slate-800">Origin</span>
            </a>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-500">
                <a href="thelab.html" class="hover:text-slate-900 transition-colors">The Lab</a>
            </div>

            <!-- Mobile Menu Button -->
            <button aria-label="mobile menu" id="mobile-menu-btn"
                class="md:hidden text-slate-500 hover:text-slate-900 p-2 focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
        <!-- Mobile Menu (Hidden by default) -->
        <div id="mobile-menu"
            class="hidden md:hidden border-t border-slate-200 bg-white/95 backdrop-blur-md absolute w-full left-0 top-16 shadow-lg">
            <div class="flex flex-col p-6 space-y-6">
                <a href="thelab.html"
                    class="mobile-link text-base font-medium text-slate-600 hover:text-slate-900 transition-colors">The
                    Lab</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-6 max-w-4xl mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-bold text-slate-900 mb-4">The 90-Day PMO Rollout</h1>
            <p class="text-lg text-slate-600">The exact step-by-step checklist to stand up a Lean-Agile Center of Excellence.</p>
        </header>

        

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 mb-8 border-l-8 border-l-indigo-500">
            <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-3">
                    <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-sm">Days 1-30</span> Discovery & Intake
                </h2>
            </div>
            <div class="space-y-4">
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <div>
                        <strong class="block text-slate-900">Map the Value Streams</strong>
                        <span class="text-sm text-slate-600">Identify how value currently flows from request to delivery. Highlight the major bottlenecks.</span>
                    </div>
                </label>
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <div>
                        <strong class="block text-slate-900">Establish the "Single Front Door"</strong>
                        <span class="text-sm text-slate-600">Configure a Jira Service Management (JSM) or Portfolio Kanban board for all incoming executive and product requests.</span>
                    </div>
                </label>
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <div>
                        <strong class="block text-slate-900">Halt "Shadow Work"</strong>
                        <span class="text-sm text-slate-600">Mandate that engineers only work on tickets that have passed through the formal Intake Review stage.</span>
                    </div>
                </label>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 mb-8 border-l-8 border-l-emerald-500">
            <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-3">
                    <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg text-sm">Days 31-60</span> Governance & Radiators
                </h2>
            </div>
            <div class="space-y-4">
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                    <div>
                        <strong class="block text-slate-900">Implement Lean Business Cases</strong>
                        <span class="text-sm text-slate-600">Replace 20-page PRDs with 1-page Lean Epic Briefs focusing on WSJF (Weighted Shortest Job First).</span>
                    </div>
                </label>
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                    <div>
                        <strong class="block text-slate-900">Build Automated Exec Dashboards</strong>
                        <span class="text-sm text-slate-600">Stop making PowerPoint slides. Build real-time Jira Dashboards for the C-Suite (Risk Radar, Epic Burnups).</span>
                    </div>
                </label>
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                    <div>
                        <strong class="block text-slate-900">Launch the Steering Committee (ESC)</strong>
                        <span class="text-sm text-slate-600">Schedule the first bi-weekly ESC meeting. Enforce the rule: Decisions and Escalations ONLY.</span>
                    </div>
                </label>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 border-l-8 border-l-purple-500">
            <div class="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-3">
                    <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-lg text-sm">Days 61-90</span> Scaling & Dependencies
                </h2>
            </div>
            <div class="space-y-4">
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-purple-600 rounded border-slate-300 focus:ring-purple-500">
                    <div>
                        <strong class="block text-slate-900">Hardwire Cross-Team Links</strong>
                        <span class="text-sm text-slate-600">Audit all active Sprints. Ensure every external dependency uses the strict "Blocks / Is Blocked By" Jira link type.</span>
                    </div>
                </label>
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-purple-600 rounded border-slate-300 focus:ring-purple-500">
                    <div>
                        <strong class="block text-slate-900">Embed Vendors into Agile Ceremonies</strong>
                        <span class="text-sm text-slate-600">Require all System Integrators to attend internal System Demos and map their risks on the shared board.</span>
                    </div>
                </label>
                <label class="flex items-start gap-4 p-3 hover:bg-slate-50 rounded-lg cursor-pointer transition-colors">
                    <input type="checkbox" class="mt-1 w-5 h-5 text-purple-600 rounded border-slate-300 focus:ring-purple-500">
                    <div>
                        <strong class="block text-slate-900">First PI (Program Increment) Planning</strong>
                        <span class="text-sm text-slate-600">Execute the first quarterly Big Room Planning event to align all Agile Release Trains for the next 10 weeks.</span>
                    </div>
                </label>
            </div>
        </div>
        
        <div class="mt-10 text-center">
             <button onclick="window.print()" class="bg-slate-900 text-white px-6 py-3 rounded-lg font-bold hover:bg-slate-800 transition-colors inline-flex items-center gap-2">
                 <i data-lucide="printer" class="w-5 h-5"></i> Print this Playbook
             </button>
        </div>
    </main>

     <!-- Footer -->
    <footer class="py-8 px-4 bg-gray-800 text-center text-gray-400">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center max-w-4xl mx-auto">
            <p>© 2025 Ayush Jain. All rights reserved.</p>
            <a href="https://www.linkedin.com/in/aayushjain" target="_blank" class="btn-linkedin max-w-xl mx-auto">
                <span class="icon-linkedin-logo"></span>
                <span>Connect on LinkedIn</span>
            </a>
        </div>
    </footer>

    <!-- Initialize Icons & Mobile Menu Script -->
    <script src="js/nav.js" defer></script>
</body>
</html>
